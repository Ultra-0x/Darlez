{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login · {{ site_name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{ --brand:#d71931; --brand-dark:#a90f24; }
  body{
    position:relative; display:grid; place-items:center; min-height:100vh; overflow:hidden;
    background:
      radial-gradient(circle at 16% 18%,rgba(215,25,49,.34),transparent 28%),
      radial-gradient(circle at 84% 78%,rgba(231,237,241,.2),transparent 30%),
      linear-gradient(145deg,#283540 0%,#44535f 68%,#a90f24 100%);
  }
  body::before,body::after{
    content:""; position:fixed; width:24rem; height:24rem; border-radius:50%;
    background:rgba(255,255,255,.11); filter:blur(50px); pointer-events:none;
  }
  body::before{ top:-8rem; left:-6rem; }
  body::after{ right:-8rem; bottom:-9rem; background:rgba(215,25,49,.25); }
  .login-card{
    position:relative; z-index:1; width:min(400px,calc(100% - 2rem)); margin:2rem auto;
    border-radius:1.4rem; background:rgba(255,255,255,.68);
    backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(255,255,255,.7); box-shadow:0 24px 70px rgba(12,21,28,.32);
  }
  .login-card .form-control{
    background:rgba(255,255,255,.48); border-color:rgba(255,255,255,.82);
    backdrop-filter:blur(10px);
  }
  .login-card .form-control:focus{ background:rgba(255,255,255,.76); border-color:rgba(215,25,49,.55); box-shadow:0 0 0 .2rem rgba(215,25,49,.14); }
  .login-card .password-toggle-button{ background:rgba(255,255,255,.48); border-color:rgba(255,255,255,.82); }
  .login-card .password-toggle-button:hover{ background:rgba(255,255,255,.8); border-color:rgba(215,25,49,.4); color:#a90f24; }
  .btn-success{ background-color:rgba(215,25,49,.92); border-color:rgba(255,255,255,.38); box-shadow:0 8px 22px rgba(169,15,36,.24); }
  .btn-success:hover{ background-color:#a90f24; border-color:rgba(255,255,255,.52); }
  .motto{ color:#a90f24; font-weight:700; letter-spacing:.03em; }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<div class="card login-card p-4 shadow">
  <div class="text-center mb-3">
    <img src="{% static 'img/darlez-logo.png' %}" alt="{{ site_name }} logo" style="height:64px;width:64px;object-fit:contain;">
  </div>
  <h4 class="mb-1 text-center">{{ site_name }}</h4>
  {% if site_motto %}<p class="motto mb-1 text-center small">{{ site_motto }}</p>{% endif %}
  <p class="text-muted mb-4 text-center">Staff sign in</p>
  {% if messages %}
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'danger' }}">{{ message }}</div>{% endfor %}
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="id_password">Password</label>
      <div class="input-group">
        <input type="password" id="id_password" name="password" class="form-control" autocomplete="current-password" required>
        <button class="btn btn-outline-secondary password-toggle-button" type="button"
                data-password-toggle data-password-target="id_password" aria-controls="id_password"
                aria-label="Show password" aria-pressed="false" title="Show password">
          <i class="bi bi-eye" data-password-toggle-icon aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-success w-100">Sign in</button>
  </form>
  <div class="text-center mt-3">
    <a href="{% url 'storefront:home' %}" class="text-decoration-none small">&larr; Back to website</a>
  </div>
</div>
<script src="{% static 'js/password-toggle.js' %}"></script>
</body>
</html>
